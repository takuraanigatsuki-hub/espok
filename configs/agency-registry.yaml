  - { type: FTS_TNVED, agency: FTS, label: "Код ТН ВЭД", law: "289-ФЗ", sla_hours: 72 }
  - { type: FSIN_CUSTODY, agency: FSIN, label: "Место отбывания", law: "196-ФЗ", sla_hours: 48 }
  - { type: FSIN_PAROLE, agency: FSIN, label: "УДО", law: "196-ФЗ", sla_hours: 48 }
  - { type: FSIN_PRETRIAL, agency: FSIN, label: "СИЗО", law: "103-ФЗ", sla_hours: 48 }
  - { type: RGV_WEAPON, agency: RGV, label: "Разрешение на оружие", law: "150-ФЗ", sla_hours: 48 }
  - { type: RGV_LICENSE, agency: RGV, label: "Учёт оружия / ЧОО", law: "226-ФЗ", sla_hours: 48 }
