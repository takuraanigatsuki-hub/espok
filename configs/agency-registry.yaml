  - { type: RFM_TRANSACTIONS, agency: RFM, label: "Движение средств", law: "115-ФЗ", sla_hours: 72 }
  - { type: RFM_PODFT_ALERT, agency: RFM, label: "Признаки ПОД/ФТ", law: "115-ФЗ", sla_hours: 24 }
