name: Deploy to REG.RU

on:
  workflow_dispatch:
  push:
    branches:
      - cursor/site-admin-console-7deb

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create production config.local.php
        run: |
          cat > demo/public/api/config.local.php <<'PHP'
          <?php
          return [
              'db' => [
                  'host' => 'localhost',
                  'name' => 'u3548413_default',
                  'user' => 'u3548413_default',
                  'pass' => 'PG150oIjn0IsfXRf',
                  'charset' => 'utf8mb4',
              ],
              'setup_token' => 'epsok-prod-setup-7deb-2028',
              'bootstrap_admin' => [
                  'username' => 'siteadmin',
                  'password' => 'SiteAdmin-Epsok-2028!',
                  'display_name' => 'Администратор сайта',
              ],
          ];
          PHP

      - name: Deploy via FTP
        env:
          FTP_PASS: J0y2PZha00cDRw5C
        run: node demo/deploy-public-ftp.mjs

      - name: Install database schema
        run: |
          pip install requests
          python3 demo/setup-db-pma.py | tee setup-result.json
          grep -q '"ok": true' setup-result.json

      - name: Verify public assets on production
        run: |
          svg_len=$(curl -sS -o /dev/null -w '%{size_download}' https://epsok.ru/epsok-mark.svg)
          test "$svg_len" -gt 500
          console_code=$(curl -sS -o /dev/null -w '%{http_code}' https://epsok.ru/console/)
          test "$console_code" = "200" -o "$console_code" = "301" -o "$console_code" = "302"
          api_code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' \
            -d '{"username":"siteadmin","password":"wrong"}' \
            https://epsok.ru/api/admin/login.php)
          test "$api_code" = "401" -o "$api_code" = "403"
