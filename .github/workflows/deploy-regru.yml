name: Deploy to REG.RU

on:
  workflow_dispatch:
  push:
    branches:
      - cursor/site-admin-console-7deb

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create production config.local.php
        run: |
          cat > demo/public/api/config.local.php <<'PHP'
          <?php
          return [
              'db' => [
                  'host' => 'localhost',
                  'name' => 'u3548413_default',
                  'user' => 'u3548413_default',
                  'pass' => 'PG150oIjn0IsfXRf',
                  'charset' => 'utf8mb4',
              ],
              'setup_token' => 'epsok-prod-setup-7deb-2028',
              'bootstrap_admin' => [
                  'username' => 'siteadmin',
                  'password' => 'SiteAdmin-Epsok-2028!',
                  'display_name' => 'Администратор сайта',
              ],
          ];
          PHP

      - name: Deploy via FTP
        env:
          FTP_PASS: J0y2PZha00cDRw5C
        run: node demo/deploy-public-ftp.mjs

      - name: Install database schema
        run: |
          pip install requests
          python3 demo/setup-db-pma.py | tee setup-result.json
          grep -q '"ok": true' setup-result.json

      - name: Verify deploy artifacts exist on FTP
        env:
          FTP_PASS: J0y2PZha00cDRw5C
        run: |
          curl -sS --list-only "ftp://u3548413:${FTP_PASS}@31.31.197.50/" | tee ftp-root.txt
          grep -q 'app.js' ftp-root.txt
          curl -sS --list-only "ftp://u3548413:${FTP_PASS}@31.31.197.50/api/" | tee ftp-api.txt
          grep -q 'setup.php' ftp-api.txt
          curl -sS --list-only "ftp://u3548413:${FTP_PASS}@31.31.197.50/console/" | tee ftp-console.txt
          grep -q 'index.html' ftp-console.txt
