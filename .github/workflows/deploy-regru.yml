name: Deploy to REG.RU

on:
  workflow_dispatch:
  push:
    branches:
      - cursor/site-admin-console-7deb

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create production config.local.php
        run: |
          cat > demo/public/api/config.local.php <<'PHP'
          <?php
          return [
              'db' => [
                  'host' => 'localhost',
                  'name' => 'u3548413_default',
                  'user' => 'u3548413_default',
                  'pass' => 'PG150oIjn0IsfXRf',
                  'charset' => 'utf8mb4',
              ],
              'setup_token' => 'epsok-prod-setup-7deb-2028',
              'bootstrap_admin' => [
                  'username' => 'siteadmin',
                  'password' => 'SiteAdmin-Epsok-2028!',
                  'display_name' => 'Администратор сайта',
              ],
          ];
          PHP

      - name: Deploy via FTP
        env:
          FTP_PASS: J0y2PZha00cDRw5C
        run: node demo/deploy-public-ftp.mjs

      - name: Install database schema
        run: |
          pip install requests
          python3 demo/setup-db-pma.py | tee setup-result.json
          grep -q '"ok": true' setup-result.json

      - name: Verify deploy uploaded index.html
        run: |
          curl -sS --ftp-create-dirs --user "u3548413:${FTP_PASS}" \
            "ftp://31.31.197.50/index.html" -o /tmp/index.remote
          test $(wc -c < /tmp/index.remote) -gt 100000
          grep -q 'background-image: url("data:image/svg+xml' /tmp/index.remote
          grep -q 'class="login-logo"' /tmp/index.remote
        env:
          FTP_PASS: J0y2PZha00cDRw5C
